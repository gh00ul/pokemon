/* Holo House • warm graphite, acid-yellow paper, quiet collector-shop details. */
:root{color-scheme:dark;--bg:#101618;--panel:#192124;--panel2:#202a2e;--line:#303b3d;--text:#f3f4ec;--muted:#a4b1b2;--lime:#dbfa89;--lime-ink:#263015;--orange:#f4b978;--danger:#ffaaa6;--blue:#9ed7ec;--radius:20px;--sans:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;--mono:ui-monospace,SFMono-Regular,Consolas,monospace;--shadow:0 18px 60px #0004}
*{box-sizing:border-box}html{scroll-behavior:smooth;scroll-padding-top:110px}body{margin:0;background:var(--bg);color:var(--text);font-family:var(--sans);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}button,input,select{font:inherit}button,a,input,select{touch-action:manipulation}button{cursor:pointer}button{color:inherit}button:disabled{opacity:.43;cursor:not-allowed}button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--lime);outline-offset:4px}a{color:var(--lime)}button svg,span svg{width:21px;height:21px;flex:none;vertical-align:middle}h1,h2,h3,p{margin:0}h1{font-weight:660;letter-spacing:-.055em;line-height:1.08}h2{font-size:26px;letter-spacing:-.035em;font-weight:620;line-height:1.2}h3{font-size:18px;letter-spacing:-.025em;line-height:1.25}p{color:var(--muted)}small{font-size:12px}.muted{color:var(--muted)}.lime{color:var(--lime)}.mono{font-family:var(--mono);font-size:.9em;font-variant-numeric:tabular-nums}.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);line-height:1.5}.row{display:flex;align-items:center;gap:12px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}.grow{flex:1}.stack{display:flex;flex-direction:column;gap:14px}.tight{gap:7px}.hidden{display:none!important}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.skip-link{position:fixed;top:-100px;left:12px;background:var(--lime);color:var(--bg);z-index:100;padding:12px}.skip-link:focus{top:12px}.icon{display:inline-flex;align-items:center;justify-content:center}.dot{display:inline-block;width:6px;height:6px;background:var(--lime);border-radius:50%;box-shadow:0 0 8px #dbfa8933}.pill{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border:1px solid var(--line);border-radius:99px;font-size:11px;font-weight:600;white-space:nowrap}.pill.lime{color:var(--lime);borde   --keyboard-inset: 0px;
  --safe-top: env(safe-area-inset-top, 0px);
  --safe-bottom: env(safe-area-inset-bottom, 0px);
  --nav-height: 66px;
}
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body.dialog-open { position: fixed; top: var(--locked-scroll, 0px); left: 0; right: 0; width: 100%; }
.mobile-welcome, .opening-wallet { display: none; }
.modal-body { min-width: 0; }
.modal-dock { border-top: 1px solid var(--line); margin-top: 18px; padding-top: 16px; }
.modal-dock .modal-actions, .modal-dock .detail-actions { margin: 0; }
.modal-dock .detail-actions { display: flex; gap: 10px; }
.modal-dock .detail-actions > .btn { flex: 1; }
.art-inspect { border: 0; padding: 0; background: none; color: inherit; width: 100%; display: block; }
.art-zoom-label { font-size: 12px; color: var(--muted); display: flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px; }
.art-zoom-label svg { width: 15px; height: 15px; }
.artwork-view { text-align: center; }
.artwork-view > .card-art { max-width: min(460px, 65dvh); margin: auto; }
.artwork-view > .slab-shell { max-width: min(380px, 55dvh); }
.artwork-view p { margin-top: 14px; font-size: 12px; }
@media (hover: none) {
  .collect-card:hover { transform: none; }
  .product:hover .pack-object { transform: rotate(-7deg); }
}
/* The same controls serve phones in portrait and landscape. */
@media (max-width: 760px), (max-width: 1024px) and (pointer: coarse) and (orientation: landscape) {
  html { scroll-padding-top: calc(80px + var(--safe-top)); scroll-padding-bottom: calc(86px + var(--safe-bottom)); }
  body { font-size: 15px; }
  h2 { font-size: 25px; }
  h3 { font-size: 18px; }
  .eyebrow { font-size: 10px; letter-spacing: .11em; }
  .footnote { font-size: 12px; line-height: 1.65; }
  .btn, .btn.small { min-height: 48px; font-size: 14px; padding: 12px 14px; border-radius: 12px; }
  .text-btn, .link-btn { min-height: 44px; font-size: 13px; padding: 10px 8px; }
  .icon-btn, .header-tools > .icon-btn { width: 44px; height: 44px; }
  input:not([type=checkbox]):not([type=file]), select,
  .search-field input, .filters select, .product select,
  .studio-select select, .setting-row select, .setting-row input[type=number] {
    font-size: 16px; min-height: 48px; line-height: 1.35;
  }
  /* Header and the thumb navigation rail. */
  .site-header { height: calc(66px + var(--safe-top)); padding-top: var(--safe-top); background: #101618f5; }
  .header-inner { padding: 0 16px; gap: 8px; }
  .brand { gap: 5px; min-width: 0; }
  .brand-mark { font-size: 30px; }
  .brand-name { font-size: 20px; letter-spacing: -.9px; }
  .desktop-nav, .header-tools > .sound-top { display: none; }
  .header-tools { gap: 8px; }
  .wallet { border: 0; padding: 5px 2px; background: none; gap: 0; border-radius: 0; text-align: right; }
  .wallet > .icon { display: none; }
  .wallet-value { font-size: 17px; font-weight: 700; white-space: nowrap; }
  .wallet small { font-size: 9px; letter-spacing: .05em; }
  main { padding: 0 16px calc(var(--nav-height) + var(--safe-bottom) + 28px); min-height: calc(var(--app-height) - 66px - var(--safe-top)); }
  .page { min-width: 0; }
  .mobile-nav {
    display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
    position: fixed; z-index: 30; left: 0; right: 0; bottom: 0;
    height: calc(var(--nav-height) + var(--safe-bottom)); padding: 5px max(8px, env(safe-area-inset-right)) var(--safe-bottom) max(8px, env(safe-area-inset-left));

    font-size: 11px; line-height: 1.2; white-space: nowrap;

  .page-head { flex-direction: column; align-items: stretch; gap: 18px; margin: 26px 0 22px; }

  .section-head { gap: 12px; margin: 24px 0 16px; align-items: center; }

    grid-template-areas: 'top top' 'art title' 'art subtitle' 'art details' 'choice choice' 'buy buy' 'odds odds';
    padding: 16px; column-gap: 16px; align-items: start; border-radius: 18px;
  }

  .product .btn { grid-area: buy; font-size: 16px; min-height: 50px; margin: 0; }
  .product .text-btn { grid-area: odds; justify-self: center; width: 100%; min-height: 44px; margin: 2px 0 -6px; font-size: 13px; }

  .shop-bottom { grid-template-columns: 1fr; gap: 12px; margin-top: 22px; }

  .tip-tile h3 { font-size: 15px; }
  .tip-tile p { font-size: 12px; }
  .tip-tile > .icon { display: none; }

  /* Binder: two readable pockets, stable search nodes, no keyboard-triggered rerenders. */

  .stat-strip > div { padding: 15px 13px; min-width: 0; }

  .fallback-symbol { font-size: 44px; }

  }

  /* Phone grading: complete odds, legible fees and separate raw/slab controls. */

  .studio-hero h2 { font-size: 28px; }
  .studio-hero p { font-size: 14px; line-height: 1.7; }

  .studio-select { flex-wrap: wrap; gap: 10px; }
  .studio-select .search-field { flex-basis: 100%; min-width: 0; }
  .studio-select select { width: 100%; }
  .grade-eligible .btn { margin-top: 10px; font-size: 13px; }
  /* Full-height opening table. Main actions stay within the viewport without scrolling. */
  body.pack-active { height: var(--app-height); overflow: hidden; }
  .pack-active .site-header, .pack-active .mobile-nav { display: none; }
  .pack-active main { height: 100%; min-height: 0; max-width: none; padding: 0; }
  .opener {
    width: 100%; height: 100%; display: grid; grid-template-rows: 48px minmax(0, 1fr);
    padding: var(--safe-top) max(16px, env(safe-area-inset-right)) max(10px, var(--safe-bottom)) max(16px, env(safe-area-inset-left));
    animation: none;
  }

    min-height: 0; width: 100%; max-width: 600px; margin: 0 auto;
    display: grid; grid-template-rows: auto 3px auto minmax(0, 1fr) auto 52px 44px auto;
    row-gap: 7px;

  .opening-title p { display: none; }

  .opening-top > .progress-labels { margin: 0; font-size: 10px; white-space: nowrap; flex-wrap: nowrap; }

  .tear-target { --pack-height: min(330px, calc(var(--stage-height, 320px) - 46px)); padding: 20px 30px 26px; touch-action: pan-y pinch-zoom; }

  }

  const icon=(name,extra='')=>`<span class="icon ${extra}" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">${ICONS[name]||ICONS.spark}</svg></span>`;

  function cardArt(c,{large=false,eager=false}={}){

  function slabArt(slab,{large=false,hidden=false,example=false}={}){

  function cardTile(item,{action='inspect',tag='',hall=false,selectable=false}={}){
    const c=E.card(item.cardId||item.id),isSlab=item.kind==='slab',key=item.kind+':'+item.id,selected=ui.selected.has(key);

  const tabInfo=[['shop','shop','Packs'],['binder','binder','Binder'],['studio','studio','Grading'],['hall','hall','Hall of Fame']];

  function notices(){let h='';if(state.pendingGrade)h+=`<div class="notice">${icon('studio')}<div class="grow"><strong>A new slab is waiting.</strong><p>Your grade is locked in and saved. Come see how it did.</p></div>${button('Reveal grade '+icon('arrow'),'pending-grade','','btn small primary')}</div>`;

  function shopView(){const t=E.totals(state),best=state.stats.bestPull?E.card(state.stats.bestPull.cardId):null;return `<div class="page">${notices()}<section class="hero"><div class="hero-copy"><div class="eyebrow"><span class="dot"></span> THE COLLECTOR’S CLUB</div><h1>Good things<br>come in <em>packs.</em></h1><p>A little nostalgia. A little luck. Open something special and make a collection that’s yours.</p><p class="mobile-welcome">Your next favorite is in here.</p><div class="hero-actions">${button('Find your next pull '+icon('arrow'),'browse','','btn primary')}<span class="hero-note">${C.CARDS.length} CARDS TO DISCOVER<br>ZERO REAL MONEY REQUIRED</span></div></div><div class="hero-gallery" aria-label="Examples of collectible chase cards"><div class="hero-ring"></div><div class="hero-card hero-left">${cardArt(E.card('swsh7-215'),{eager:true})}</div><div class="hero-card hero-right">${cardArt(E.card('sv3pt5-205'),{eager:true})}</div><div class="hero-card hero-front">${cardArt(E.card('sv3pt5-199'),{eager:true})}</div><span class="hero-spark" aria-hidden="true">✧</span><div class="hero-ticket">${icon('spark')}<div><div class="eyebrow">THE NEXT ONE COULD BE THE ONE</div><strong>A little collecting magic.</strong></div></div><span class="hero-caption">DISPLAY CARDS · FIND THEM IN PACKS</span></div></section><section class="dashboard-metrics" aria-label="Your collection snapshot"><div class="dashboard-metric"><span class="metric-icon">${icon('binder')}</span><div><span class="metric-label">Binder estimate</span><div class="metric-value">${cash(t.value)} <small>static game value</small></div></div></div><div class="dashboard-metric"><span class="metric-icon">${icon('cards')}</span><div><span class="metric-label">Cards collected</span><div class="metric-value">${t.unique} <small>of ${C.CARDS.length} unique · ${t.copies} copies</small></div></div></div><div class="dashboard-metric"><span class="metric-icon">${icon('spark')}</span><div><span class="metric-label">Your best pull</span><div class="metric-value">${best?escape(best.name):'Still a mystery'} <small>${best?cash(best.value):'Make your first discovery'}</small></div></div></div></section><section id="pack-shop"><div class="section-head"><div><h2>Choose your next discovery.</h2><p>Every pack has a personality. Every box saves 10%.</p></div><span class="eyebrow">01 — 05</span></div><div class="pack-grid">${C.PACKS.map((p,i)=>product(p,i)).join('')}</div></section><div class="shop-bottom"><div class="tip-tile">${icon('shield')}<div class="grow"><h3>Good luck has a safety net.</h3><p>Miss long enough and your next pack gets a guaranteed hit. Each series tracks separately.</p></div>${button(icon('arrowUp'),'odds','data-id="electric" aria-label="Read bad-luck protection rules"','text-btn')}</div><div class="tip-tile">${icon('studio')}<div class="grow"><h3>A favorite deserves a little glass.</h3><p>Submit a card for a randomized grade. Maybe it’s a gem. Maybe it’s a lesson.</p></div>${button(icon('arrowUp'),'nav','data-route="studio" aria-label="Visit the grading studio"','text-btn')}</div></div>${state.session?.phase==='results'?button('Review your last opening '+icon('arrow'),'nav','data-route="opening"','link-btn'):''}${footer()}</div>`;}
  function product(p,i){const q=ui.qty[p.id]||1,price=E.cost(p,q),pityText=p.pity?`${C.TIERS[p.target]}+ by pack ${p.pity}`:'A Crown in every pack';return `<article class="product ${p.id==='electric'?'featured':''}" id="product-${p.id}" style="--pack-color:${p.color}"><div class="product-top"><span class="product-number">VOL. 0${i+1}</span>${p.id==='electric'?'<span class="pill lime">HOUSE FAVORITE</span>':`<span class="pill">${p.slots.length} CARDS</span>`}</div><div class="product-art">${packArt(p)}</div><div class="product-body"><h3>${p.name}</h3><p class="subtitle">${p.subtitle}</p><div class="product-details"><span>${icon('spark')}${p.guarantee}</span><span>${icon('shield')}${pityText}</span></div><label class="sr-only" for="quantity-${p.id}">Pack quantity for ${p.name}</label><select id="quantity-${p.id}" data-product="${p.id}"><option value="1" ${q===1?'selected':''}>1 pack · ${p.slots.length} cards</option><option value="${p.box}" ${q===p.box?'selected':''}>${p.box}-pack box · save 10%</option></select>${button(`Open ${q===1?'pack':'box'} · ${cash(price)}`,'buy',`data-id="${p.id}" data-qty="${q}" data-transaction="true" aria-label="Buy ${q} ${p.name} ${q===1?'pack':'packs'} for ${cash(price)}"`,'btn full')}${button('Contents & odds '+icon('arrowUp'),'odds',`data-id="${p.id}"`,'text-btn')}</div></article>`;}
  function filteredBinder(){

ion value="${i}" ${ui.rarity===String(i)?'selected':''}>${r}</option>`).join('')}</select><select id="binder-sort" aria-label="Sort your collection"><option value="value" ${ui.sort==='value'?'selected':''}>Value: high to low</option><option value="name" ${ui.sort==='name'?'selected':''}>Name: A to Z</option><option value="quantity" ${ui.sort==='quantity'?'selected':''}>Most copies</option><option value="newest" ${ui.sort==='newest'?'selected':''}>Newest discovered</option></select></div><div id="binder-content">${ui.selecting?`<div class="row between" style="margin-bottom:18px"><span class="footnote">Select card types. Choose quantities before selling.</span>${button('Select shown','select-shown','','text-btn')}</div>`:''}${!items.length?emptyState(t.copies?'Nothing in this pocket.':'A binder starts with one pack.',t.copies?'Try a different search or filter. Your other cards are still right where you left them.':'Your first favorite is out there. Visit the shop and make a little room for surprise.',t.copies?'Clear filters':'Find your first pack',t.copies?'clear-filters':'nav',t.copies?'':'data-route="shop"'):`<div class="card-grid">${shown.map(x=>cardTile(x,{selectable:ui.selecting,action:ui.selecting?'select-card':'inspect'})).join('')}</div><div class="load-more">${items.length>shown.length?button(`Show more · ${shown.length} of ${items.length}`,'more-cards','','btn ghost'):`<p class="footnote">${items.length} ${items.length===1?'card type':'card types'} shown · all estimates are fictional game values</p>`}</div>`}${ui.selecting&&ui.selected.size?`<div class="selection-bar"><strong>${ui.selected.size} ${ui.selected.size===1?'type':'types'} selected</strong>${button('Clear','clear-selection','','text-btn')}${button('Review sale '+icon('arrow'),'sell-selection','','btn')}</div>`:''}</div>${footer()}</div>`;}
  function emptyState(title,text,label,action,extra=''){return `<div class="empty-state"><span class="empty-symbol" aria-hidden="true">✧</span><h2>${title}</h2><p>${text}</p>${button(label,action,extra,'btn primary')}</div>`;}

  function lockPage() {

    document.body.classList.add('dialog-open');

  function unlockPage() {

    window.scrollTo({top: y, behavior: 'instant'});
  }

  function gradeDialog(id){const c=E.card(id);if(!(state.inventory[id]>0)){toast('Keep an ungraded copy before submitting it.');return;}if(state.pendingGrade){pendingGradeDialog();return;}ui.gradeCard=id;const price=E.fee(id);showDialog('Before it goes under glass…',`<div class="grading-overview">${cardArt(c)}<div><h3>${escape(c.name)}</h3><p>${escape(c.edition)} · #${c.number}<br>Raw estimate ${cash(c.value)} · Raw resale ${cash(E.resale(c.value))}</p></div></div><p class="modal-intro">This consumes <strong>one ungraded copy</strong> and the fee. It creates one slab, not an extra card. The grade is random, permanently saved at submission, and cannot be rerolled by refreshing.</p><table class="odds-table"><thead><tr><th>HHG GRADE</th><th>CHANCE</th><th>ESTIMATE</th><th>SLAB RESALE</th></tr></thead><tbody>${C.GRADES.map(g=>`<tr><td><strong>${g.grade}</strong> · ${g.label}</td><td>${g.weight}%</td><td>${cash(Math.round(c.value*g.multiplier))}</td><td>${cash(E.resale(Math.round(c.value*g.multiplier)))}</td></tr>`).join('')}</tbody></table><div class="grading-cost"><span>Non-refundable grading fee<br><small>$8 + 35% of the raw estimate</small></span><strong>${cash(price)}</strong></div><p class="footnote">A grade 6 or 7 lowers the estimate. Most grades will not make back the fee on resale. No regrading or real-world certification. ${state.wallet<price?`<strong style="color:var(--danger)">You need ${cash(price-state.wallet)} more to submit.</strong>`:''}</p><div class="modal-actions">${button('Keep it ungraded','close-modal','','btn ghost')}${button(state.wallet<price?'View funding options':`Submit · ${cash(price)}`,'confirm-grade','data-transaction="true"','btn primary')}</div>`,{kind:'grade'});}
  function pendingGradeDialog(){if(!state.pendingGrade)return;const pending=state.pendingGrade,slab=state.slabs.find(s=>s.id===pending.id);if(!slab)return;const c=E.card(slab.cardId),g=C.GRADES.find(g=>g.grade===slab.grade);showDialog(pending.shown?'Certified. Collected. Yours.':'The verdict is in.',`<div class="grade-result"><div class="eyebrow">HOLO HOUSE GRADING · ${escape(slab.cert)}</div><h3>${pending.shown?(slab.grade===10?'A perfect little moment.':g.label+'. Made yours.'):'One card. One verdict.'}</h3><p>${escape(c.name)} · ${escape(c.edition)}</p><div class="${pending.shown?'grade-pop':''}">${slabArt(slab,{large:true,hidden:!pending.shown})}</div>${pending.shown?`<div class="pill ${slab.grade===10?'lime':''}">HHG ${slab.grade} · ${g.label.toUpperCase()}</div><div class="grade-price">${cash(slab.value)}</div><p>Graded estimate · actual resale ${cash(E.resale(slab.value))}</p><p class="footnote" style="margin-top:8px">Fee paid: ${cash(slab.fee)} · raw copy consumed: 1</p>${button('Add it to the shelf '+icon('arrow'),'finish-grade','','btn primary')}`:`<p>Your slab is already saved. The reveal can wait; the grade won’t change.</p>${button('Reveal my grade '+icon('spark'),'reveal-grade','data-transaction="true"','btn primary')}`}<div class="modal-footer">SIMULATED GRADING · NOT A REAL CERTIFICATION SERVICE</div></div>`,{kind:'pending-grade'});}
  function settingsDialog(){const s=state.settings;showDialog('Make yourself at home.',`<form id="settings-form"><div class="setting-row"><label for="setting-sound"><strong>Opening sounds</strong><small>Soft, synthesized sounds. Off by default.</small></label><input id="setting-sound" class="switch" type="checkbox" ${s.sound?'checked':''}></div><div class="setting-row"><label for="setting-motion"><strong>Reduce motion</strong><small>Your device’s reduced-motion preference is always respected.</small></label><input id="setting-motion" class="switch" type="checkbox" ${s.reducedMotion?'checked':''}></div><div class="setting-row"><label for="setting-pace"><strong>Auto-reveal pace</strong><small>Manual opening is always available.</small></label><select id="setting-pace"><option value="normal" ${s.pace==='normal'?'selected':''}>Savor it</option><option value="quick" ${s.pace==='quick'?'selected':''}>Keep it moving</option></select></div><section class="setting-section"><div class="setting-row"><label for="setting-autosell"><strong>Auto-sell inexpensive duplicates</strong><small>Keep your first ungraded copy of every version.</small></label><input id="setting-autosell" class="switch" type="checkbox" ${s.autoSell?'checked':''}></div><div class="setting-row"><label for="setting-threshold"><strong>Estimated value threshold</strong><small>Duplicates at or below this amount are sold.</small></label><input type="number" id="setting-threshold" min="0" max="10000" step="0.01" inputmode="decimal" value="${(s.threshold/100).toFixed(2)}" aria-label="Auto-sell value threshold in dollars"></div><p>Applies as cards are revealed in <strong>future purchases only</strong>. It never sells your last ungraded copy, never touches slabs, and never sells existing binder cards. Current paid openings keep the rule they were purchased with. Cash received is 65% of each card’s estimate.</p></section><div class="modal-actions">${button('Save preferences','save-settings','','btn primary full')}</div></form><section class="setting-section"><h3>Your collection stays here.</h3><p>Progress is saved in this browser’s IndexedDB. Clearing site data or switching browsers won’t carry it with you. Export a backup before moving devices. Importing replaces the entire local collection.</p><div class="backup-actions">${button(icon('download')+' Export save','export','','btn ghost')}${button(icon('upload')+' Import save','import','','btn ghost')}</div><input id="import-file" type="file" accept="application/json,.json" hidden><p class="footnote" style="margin-top:12px"><span class="dot"></span> Last committed: ${escape(new Date(state.updatedAt).toLocaleString())}</p></section><section class="setting-section"><div class="row between"><div><h3>A fresh start.</h3><p>Erase this collection and return to ${cash(C.STARTING_CASH)}.</p></div>${button('Reset game','reset','','btn danger small')}</div></section><div class="modal-footer">All money is fictional. Artwork requires an internet connection until cached. Gameplay and the saved catalog do not depend on image availability. ${button('About Holo House '+icon('arrowUp'),'about','','text-btn')}</div>`,{kind:'settings'});}
  function fundsDialog(required,context='packs'){showDialog('A little short on play money.',`<p class="modal-intro">This ${context==='grading'?'grading submission':'purchase'} costs <strong>${cash(required)}</strong>. Your wallet has <strong>${cash(state.wallet)}</strong>; you need ${cash(Math.max(0,required-state.wallet))} more.</p><div class="stack">${button(icon('binder')+' Sell cards from your binder','nav','data-route="binder"','btn primary full')}${button(icon('shop')+' Browse packs from $14','cheaper','','btn ghost full')}${button(icon('hall')+' Check milestone rewards','nav','data-route="hall"','btn ghost full')}</div><p class="footnote" style="margin-top:21px">No top-ups, real-money purchases, or hidden overdrafts. Your cards are yours to keep; you can also deliberately start over with a fresh wallet.</p><div class="modal-actions">${button('Keep browsing','close-modal','','btn ghost')}${button('Start over…','reset','','btn danger')}</div>`,{kind:'funds'});}
  function resetDialog(){showDialog('Start a new collection?',`<p class="modal-intro">This permanently removes your wallet, binder, slabs, milestones and any unfinished paid opening from <strong>this browser</strong>. A new game starts with ${cash(C.STARTING_CASH)}. Export a backup first to keep this collection.</p>${button(icon('download')+' Export this collection','export','','btn ghost full')}<label for="reset-confirm" class="footnote" style="display:block;margin-top:20px">Type <strong>RESET</strong> to confirm.</label><input class="reset-input" id="reset-confirm" placeholder="RESET" autocomplete="off" autocapitalize="characters"><div class="modal-actions">${button('Keep my collection','close-modal','','btn ghost')}${button('Erase & start again','confirm-reset','id="reset-button" disabled','btn danger')}</div>`,{kind:'reset'});}
  function aboutDialog(){showDialog('A little collecting magic.',`<p class="modal-intro"><strong>Holo House</strong> is an unofficial, fan-made Pokémon pack-opening simulator. It is not a card-battle game and has no accounts, backend, ads, paid API, purchases, cash withdrawals or monetary prizes.</p><div class="stack"><section><h3>Real card identities. Fictional economy.</h3><p class="slot-note">${C.CARDS.length} bundled card records span seven sets, including the original Base Set, Scarlet & Violet—151, and iconic modern alternate arts. Every estimated value, House tier, pack product, probability and grading result is a static game rule—not live market data, an official pack’s odds, or an assessment of real card condition.</p></section><section><h3>Artwork & attribution</h3><p class="slot-note">Card identities and public artwork URLs reference the <a href="https://github.com/PokemonTCG/pokemon-tcg-data" target="_blank" rel="noopener noreferrer">Pokémon TCG community data project</a>. Images load from <a href="https://pokemontcg.io/" target="_blank" rel="noopener noreferrer">Pokémon TCG API’s image CDN</a>. Pokémon names and artwork belong to their respective rights holders. This project is not affiliated with or endorsed by them.</p></section><section><h3>Your save is the source of truth.</h3><p class="slot-note">A purchase locks every pack’s contents and charges your wallet in one IndexedDB transaction. Each reveal, sale and grading submission is also atomic. Competing browser tabs are serialized and stale actions are rejected. A failed image is only a failed image: the same card remains yours.</p></section><section><h3>Offline & privacy</h3><p class="slot-note">On a static host, the service worker caches the app and previously viewed artwork. Uncached art needs a connection; otherwise, labeled placeholders keep everything playable. Your save stays in your browser unless you export it. Image requests go to the public artwork host; there is no analytics.</p></section></div><div class="modal-actions">${button('Back to collecting','close-modal','','btn primary')}</div>`,{kind:'about'});}

  /* Procedural audio: no files, autoplay, tracking, or dependencies. */
  const Sound={
    ctx:null,
    ensure(){try{const AC=window.AudioContext||window.webkitAudioContext;if(!AC)return;if(!this.ctx)this.ctx=new AC();if(this.ctx.state==='suspended')this.ctx.resume().catch(()=>{});}catch{}},
    play(type='tap',tier=0){if(!state?.settings.sound)return;this.ensure();const ctx=this.ctx;if(!ctx||ctx.state!=='running')return;try{const now=ctx.currentTime;if(type==='tear'){const length=Math.floor(ctx.sampleRate*.17),buffer=ctx.createBuffer(1,length,ctx.sampleRate),channel=buffer.getChannelData(0);for(let i=0;i<length;i++)channel[i]=(Math.random()*2-1)*(1-i/length);const source=ctx.createBufferSource(),gain=ctx.createGain(),filter=ctx.createBiquadFilter();source.buffer=buffer;filter.type='highpass';filter.frequency.value=1600;gain.gain.setValueAtTime(.055,now);source.connect(filter).connect(gain).connect(ctx.destination);source.start();source.stop(now+.18);return;}const notes=type==='grade'?[523.25,659.25,783.99,1046.5]:tier===5?[523.25,659.25,783.99,1046.5]:tier>=4?[440,554.37,659.25]:type==='sale'?[440,660]:[tier>=3?554:392];notes.forEach((f,i)=>{const osc=ctx.createOscillator(),gain=ctx.createGain(),t=now+i*.09;osc.type='sine';osc.frequency.value=f;gain.gain.setValueAtTime(0,t);gain.gain.linearRampToValueAtTime(.035,t+.014);gain.gain.exponentialRampToValueAtTime(.0001,t+(notes.length>1?.52:.15));osc.connect(gain).connect(ctx.destination);osc.start(t);osc.stop(t+.6);});}catch{}},
  };
  function toast(text){clearTimeout(toastTimer);const el=$('#toast');el.textContent=text;el.classList.add('show');toastTimer=setTimeout(()=>el.classList.remove('show'),4100);}

  async function importFile(file){if(!file)return;if(file.size>5*1024*1024){toast('That file is too large to be a Holo House save.');return;}try{const data=JSON.parse(await file.text());if(data.app!=='holo-house'||data.format!==1||!data.state)throw new Error('Choose a valid Holo House JSON backup.');E.validate(data.state);ui.imported=E.clone(data.state);const t=E.totals(ui.imported);showDialog('Restore this collection?',`<p class="modal-intro">This replaces your entire current local game. Export your current collection first to keep a copy.</p><div class="stat-strip"><div><span class="label">Backup wallet</span><strong>${cash(ui.imported.wallet)}</strong></div><div><span class="label">Total cards</span><strong>${t.copies}</strong></div><div><span class="label">Unique cards</span><strong>${t.unique}</strong></div><div><span class="label">Slabs</span><strong>${t.slabs}</strong></div></div><p class="footnote">${ui.imported.session&&ui.imported.session.phase!=='results'?'Includes an unfinished paid opening. Its locked contents and progress will be restored.':'No unfinished opening.'}</p><div class="modal-actions">${button('Cancel','close-modal','','btn ghost')}${button('Replace & restore','confirm-import','','btn primary')}</div>`,{kind:'import-confirm'});}catch(e){toast(e.message||'This backup could not be read. Your current save is unchanged.');}}

        case 'view-art':artworkDialog(el.dataset.kind||'raw',el.dataset.id);break;
        case 'inspect':detailDialog(el.dataset.kind||'raw',el.dataset.id);break;
        case 'step':{const input=document.getElementById(el.dataset.for);if(input){input.value=Math.max(1,Math.min(Number(input.max),quantityValue(input)+Number(el.dataset.delta)));input.dispatchEvent(new Event('input',{bubbles:true}));if(input.dataset.saleIndex!==undefined)input.dispatchEvent(new Event('change',{bubbles:true}));}break;}
        case 'detail-sell':{if(!ui.detail)break;const qty=ui.detail.kind==='slab'?1:quantityValue($('#detail-quantity'));openSale([{kind:ui.detail.kind,id:ui.detail.id,qty}]);break;}
        case 'confirm-sale':{const items=E.clone(ui.sale),expected=ui.modalRevision;const r=await commit(s=>E.sell(s,items),{expected});if(r){closeDialog();ui.selected.clear();render();Sound.play('sale');toast(`${r.count} ${r.count===1?'card':'cards'} sold. ${cash(r.total)} added to your wallet.`);}else closeDialog();break;}
        case 'grade':gradeDialog(el.dataset.id);break;
        case 'confirm-grade':{const id=ui.gradeCard;if(!id)break;if(state.wallet<E.fee(id)){fundsDialog(E.fee(id),'grading');break;}const expected=ui.modalRevision;if(state.settings.sound)Sound.ensure();const r=await commit(s=>E.grade(s,id),{expected});if(r){Sound.play('tear');pendingGradeDialog();}else closeDialog();break;}
        case 'pending-grade':pendingGradeDialog();break;
        case 'reveal-grade':{const expected=ui.modalRevision;const r=await commit(s=>E.revealGrade(s),{expected});if(r){Sound.play('grade');pendingGradeDialog();}else closeDialog();break;}
        case 'finish-grade':{const expected=ui.modalRevision;const r=await commit(s=>E.finishGrade(s),{expected});if(r){closeDialog();ui.binderTab='slabs';go('binder');toast('Your slab is on the shelf.');}else closeDialog();break;}
        case 'claim':{const r=await commit(s=>E.claim(s,el.dataset.id));if(r){Sound.play('sale');toast(`Milestone collected. ${cash(r.reward)} is in your wallet.`);}break;}
        case 'save-settings':{const input=$('#setting-threshold'),v=Number(input.value);if(input.value.trim()===''||!Number.isFinite(v)||v<0||v>10000){input.setCustomValidity('Enter a value from 0 to 10,000.');input.reportValidity();break;}input.setCustomValidity('');const values={sound:$('#setting-sound').checked,reducedMotion:$('#setting-motion').checked,autoSell:$('#setting-autosell').checked,pace:$('#setting-pace').value,threshold:Math.round(v*100)};if(values.sound)Sound.ensure();const r=await commit(s=>E.settings(s,values),{expected:ui.modalRevision});if(r){closeDialog();Sound.play();toast('Preferences saved. Auto-sell changes apply to new purchases.');}else closeDialog();break;}
        case 'export':case 'recover-export':await exportSave();break;
        case 'import':$('#import-file').click();break;
        case 'confirm-import':{if(!ui.imported)break;const imported=E.clone(ui.imported);const r=await commit(()=>({replacement:imported}),{expected:ui.modalRevision,renderView:false});if(r){ui.imported=null;ui.selected.clear();ui.showGradeAfterNavigation=!!state.pendingGrade;go(state.session&&state.session.phase!=='results'?'opening':'binder');toast('Collection restored from your backup.');}else closeDialog();break;}
        case 'reset':case 'recover-reset':resetDialog();break;
        case 'confirm-reset':{if($('#reset-confirm')?.value!=='RESET')break;const r=await commit(()=>({replacement:E.initial()}),{expected:storageFailure?null:ui.modalRevision,renderView:false,replace:true});if(r){ui.selected.clear();ui.selecting=false;ui.search='';ui.binderTab='all';go('shop');toast('Fresh binder. Fresh possibilities.');}break;}
        case 'reload':location.reload();break;
      }
    }catch(error){toast(error.message||'Something went wrong. Your last committed save is safe.');}
  });
  document.addEventListener('input',event=>{const el=event.target;if(el.id==='binder-search'){ui.search=el.value;ui.limit=36;updateSearchResults('binder');}else if(el.id==='studio-search'){ui.studioSearch=el.value;ui.studioLimit=24;updateSearchResults('studio');}else if(el.dataset.saleIndex!==undefined){ui.sale[Number(el.dataset.saleIndex)].qty=quantityValue(el);refreshSaleQuote();}else if(el.id==='detail-quantity')updateDetailPrice();else if(el.id==='reset-confirm')$('#reset-button').disabled=el.value!=='RESET';else if(el.id==='setting-threshold')el.setCustomValidity('');});
  document.addEventListener('change',event=>{const el=event.target;
    if(el.dataset.product){
      const id=el.dataset.product,p=E.pack(id),q=Number(el.value);ui.qty[id]=q;
      const buy=main.querySelector(`[data-action="buy"][data-id="${id}"]`);
      buy.dataset.qty=q;buy.textContent=`Open ${q===1?'pack':'box'} · ${cash(E.cost(p,q))}`;
      buy.setAttribute('aria-label',`Buy ${q} ${p.name} packs for ${cash(E.cost(p,q))}`);
    }
    else if(el.id==='rarity-filter'){ui.rarity=el.value;ui.limit=36;render({focus:el.id});}
    else if(el.id==='binder-sort'){ui.sort=el.value;render({focus:el.id});}
    else if(el.id==='duplicates-filter'){ui.duplicates=el.checked;ui.limit=36;render({focus:el.id});}
    else if(el.id==='studio-sort'){ui.studioSort=el.value;render({focus:el.id});}
    else if(el.dataset.saleIndex!==undefined){el.value=quantityValue(el);ui.sale[Number(el.dataset.saleIndex)].qty=Number(el.value);refreshSaleQuote();}
    else if(el.id==='detail-quantity'){el.value=quantityValue(el);updateDetailPrice();}
    else if(el.id==='import-file')importFile(el.files?.[0]);
  });
  document.addEventListener('submit',event=>{event.preventDefault();if(event.target.id==='settings-form')dialog.querySelector('[data-action="save-settings"]')?.click();});
  dialog.addEventListener('click',event=>{if(event.target===dialog){const r=dialog.getBoundingClientRect();if(event.clientX<r.left||event.clientX>r.right||event.clientY<r.top||event.clientY>r.bottom)closeDialog();}});
  dialog.addEventListener('cancel',event=>{event.preventDefault();stopAuto();closeDialog();});
  document.addEventListener('keydown',event=>{if(event.key==='Enter'&&['binder-search','studio-search'].includes(event.target.id)){event.preventDefault();event.target.blur();}});
  document.addEventListener('visibilitychange',()=>{if(document.hidden){const was=ui.auto;stopAuto();if(was&&state)render();}});
  // A failed high-resolution image tries the same card's thumbnail once. Never reroll.
  document.addEventListener('error',event=>{const img=event.target;if(img.tagName!=='IMG'||!img.closest('.card-art'))return;navigator.serviceWorker?.controller?.postMessage({type:'evict-art',url:img.src});if(img.dataset.small){const src=img.dataset.small;delete img.dataset.small;img.src=src;return;}img.hidden=true;const art=img.closest('.card-art');art.classList.add('image-failed');const label=art.querySelector('.artwork-status');if(label)label.textContent='Artwork unavailable · card saved';},true);
  let drag=null;
  document.addEventListener('pointerdown',event=>{
    const target=event.target.closest('#tear-pack');
    if(!target||!event.isPrimary||state?.session?.phase!=='sealed')return;
    drag={target,id:event.pointerId,x:event.clientX,y:event.clientY,dx:0,axis:null};
    try{target.setPointerCapture(event.pointerId);}catch{}
  });
  document.addEventListener('pointermove',event=>{
    if(!drag||event.pointerId!==drag.id)return;
    const dx=event.clientX-drag.x,dy=event.clientY-drag.y;
    if(!drag.axis&&Math.max(Math.abs(dx),Math.abs(dy))>12)drag.axis=Math.abs(dx)>Math.abs(dy)*1.2?'x':'y';
    if(drag.axis!=='x')return;
    drag.dx=Math.abs(dx);drag.target.classList.add('dragging');
    drag.target.style.setProperty('--tear',Math.min(drag.dx/120,1));event.preventDefault();
  },{passive:false});
  document.addEventListener('pointerup',async event=>{
    if(!drag||event.pointerId!==drag.id)return;
    const current=drag;drag=null;
    if(current.axis)ui.suppressTearClick=performance.now()+450;
    if(current.axis==='x'&&current.dx>Math.min(82,current.target.clientWidth*.32)&&state?.session?.phase==='sealed')await performAdvance();
    else{current.target.style.setProperty('--tear',0);current.target.classList.remove('dragging');}
  });
  document.addEventListener('pointercancel',event=>{
    if(drag&&event.pointerId===drag.id){drag.target.style.setProperty('--tear',0);drag.target.classList.remove('dragging');drag=null;}
  });
  Store.subscribe(async()=>{if(busy)return;try{const fresh=await Store.read();if(fresh&&fresh.revision>state.revision){E.validate(fresh);state=fresh;stopAuto();render();if(ui.modalKind==='pending-grade'){if(state.pendingGrade)pendingGradeDialog();else closeDialog();}toast('Collection synced from your other tab.');}}catch{toast('Another tab changed the save. Reload before continuing.');}});
  async function boot(){try{state=await Store.init();if(!location.hash&&state.session&&state.session.phase!=='results')route='opening';render();if(state.pendingGrade)pendingGradeDialog();if(!window.HH_STANDALONE&&'serviceWorker'in navigator&&/^https?:$/.test(location.protocol))navigator.serviceWorker.register('./sw.js').catch(()=>{});}catch(error){storageFailure=error;let damaged=null;try{damaged=await Store.damaged();}catch{}$('#header').innerHTML='<div class="header-inner"><span class="brand"><span class="brand-mark">✦</span><span class="brand-name">holohouse.</span></span></div>';main.innerHTML=`<section class="storage-error"><span class="eyebrow">LET’S KEEP YOUR COLLECTION SAFE</span><h1>${damaged?'This save needs a little attention.':'Device storage is unavailable.'}</h1><p>${escape(error.message)}</p><p style="margin-top:15px">${damaged?'Your existing data has not been erased. Export it for safekeeping before starting over.':'Open the game in a regular browser tab and allow site storage. When opening a local file is restricted, use the included local-server instructions or a static HTTPS host.'}</p><div class="row">${damaged?button('Export unreadable save','recover-export','','btn ghost')+button('Reset local game…','recover-reset','','btn danger'):''}${button('Try again','reload','','btn primary')}</div></section>`;}}
  boot();
})();

</script>
</body>
</html>
